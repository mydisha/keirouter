# KeiRouter configuration example.
#
# All values are optional and have sensible defaults for local single-user use.
# Every field can also be set via environment variables prefixed KEIROUTER_ with
# double underscores for nesting, e.g. KEIROUTER_SERVER__PORT=8080.
#
# Pass this file with:  keirouter -config config.yaml

server:
  host: 127.0.0.1
  port: 20180
  # Abort an upstream stream that produces no bytes for this long.
  stream_stall_timeout: 5m
  # Keep SSE client connections alive through proxy idle periods. Zero disables.
  stream_heartbeat_interval: 15s
  # Bound non-streaming upstream calls.
  request_timeout: 5m
  # Allowed dashboard origins. Use specific origins in production.
  cors_origins:
    - "*"
  # Maximum inbound API request body size in bytes (default: 128 MiB).
  max_request_body_bytes: 134217728

database:
  # "sqlite" (default, zero-config) or "postgres".
  driver: sqlite
  # SQLite: empty => <data_dir>/keirouter.db. Postgres: required DSN, e.g.
  #   postgres://user:pass@localhost:5432/keirouter?sslmode=disable
  dsn: ""
  # Connection pool sizing and recycling. The values below suit Postgres.
  # SQLite reads them too, but its defaults when they are unset (0) are tuned
  # for a small idle footprint: max(GOMAXPROCS, 8) open, 2 idle, and idle
  # connections closed after conn_max_idle_time so their page caches are freed.
  # Each SQLite connection holds up to 2 MiB of page cache.
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

security:
  # Base64 32-byte root key for envelope encryption of stored credentials.
  # Leave empty for local use (auto-generated to <data_dir>/master.key).
  # In production, provide via KEIROUTER_SECURITY__MASTER_KEY or a KMS-managed value.
  master_key: ""
  # Signs dashboard session tokens. Auto-generated if empty.
  jwt_secret: ""
  # How long a dashboard session stays valid.
  session_ttl: 24h
  # Reject non-loopback access to the dashboard/admin API. Set false only when
  # the admin API is protected by a reverse proxy or network policy.
  bind_loopback_only: true
  # Allow provider base URLs on loopback/private networks for local or LAN LLMs
  # such as vLLM, Ollama, or LM Studio. Cloud metadata and link-local addresses
  # remain blocked.
  allow_private_base_url: false
  # Trust X-Forwarded-Proto / RFC 7239 Forwarded headers when deciding whether
  # the dashboard session cookie gets the Secure attribute. With the default
  # (true), a TLS-terminating reverse proxy (nginx/Caddy/Traefik), Tailscale
  # Funnel, or Cloudflare Tunnel that asserts proto=https causes the cookie to
  # be marked Secure, so it is only ever sent over HTTPS. Trusting these
  # headers is safe here: they can only ever enable the Secure attribute.
  # When disabled, the cookie is Secure only on direct TLS connections —
  # plain-HTTP dashboards (e.g. a fresh install on http://<vps-ip>:20180) get a
  # non-Secure cookie so browsers accept it (issue #56).
  trust_forwarded_headers: true

meter:
  # Buffered/batched usage writes. Keeps request latency low and reduces DB
  # round-trips for both SQLite and Postgres.
  async: true
  batch_size: 100
  flush_interval: 1s
  queue_size: 10000
  # When queue is full: "sync" writes inline to avoid data loss, "drop" drops.
  full_queue_policy: sync
  shutdown_flush_timeout: 5s

limits:
  # Per-key rate limiter. Off by default for local development.
  enabled: false
  # "memory" for a single instance. "redis" shares RPM/TPM windows, concurrency
  # slots and budget spend across every replica behind a load balancer (HA).
  backend: memory
  # Defaults apply only when an API key has no assigned plan. Zero means unlimited.
  default_rpm: 0
  default_tpm: 0
  default_concurrency: 0
  # Fixed counting window and stale bucket cleanup cadence.
  window: 1m
  cleanup_interval: 1m
  # TPM charges an estimate up front (prompt + max_tokens). With reconcile on,
  # the estimate is corrected to the real usage once the response finishes.
  reconcile_tokens: true
  # Output tokens reserved when a chat request sets no max_tokens. 0 = none.
  output_token_floor: 0
  # Cap on the max_tokens part of the reservation (e.g. 8192), so clients that
  # always send a huge max_tokens do not exhaust TPM up front. 0 = no cap.
  output_reserve_cap: 0
  # Retry-After hint sent when a key hits its concurrency limit.
  concurrency_retry_after: 1s
  # Per-IP abuse guards; they apply even when enabled is false. 0 = off.
  auth_failures_per_minute: 20   # then 429 for that IP's invalid keys; valid keys and loopback are never refused
  login_attempts_per_minute: 5
  # backend=redis only. Empty falls back to cache.redis_url.
  redis_url: ""            # e.g. redis://:password@redis:6379/0 or rediss://...
  # Deadline for each limiter round trip. A slower or failed call trips a
  # circuit breaker for 5s and requests follow fail_mode meanwhile.
  redis_timeout: 100ms
  # While redis is unreachable: "local" = same limits enforced per process,
  # "open" = admit everything, "closed" = reject with a retryable 429.
  fail_mode: local
  # A concurrency slot held by a crashed replica frees itself after this long.
  lease_ttl: 1m
  # Shared budget counters re-seed from the usage table this often, bounding
  # drift from increments lost in a crash.
  budget_counter_ttl: 1m

audit:
  # Records every dashboard sign-in and configuration change (who, what,
  # from where, outcome) in the audit_log table. Rows are HMAC hash-chained:
  # GET /api/audit/verify detects an edited or inserted row, or one deleted
  # from the middle of a chain.
  enabled: true
  # Rows older than this are deleted hourly. 0 keeps them forever.
  retention_days: 365
  buffer_size: 4096
  otlp:
    # Export every event as an OpenTelemetry log record over OTLP/HTTP (JSON),
    # e.g. to an OTel Collector, Grafana, Datadog, Elastic or Splunk.
    # Empty falls back to OTEL_EXPORTER_OTLP_LOGS_ENDPOINT /
    # OTEL_EXPORTER_OTLP_ENDPOINT; with neither set, export is off.
    endpoint: ""           # e.g. http://otel-collector:4318
    # Extra request headers (merged over OTEL_EXPORTER_OTLP_HEADERS).
    headers: {}            # e.g. { Authorization: "Bearer ..." }
    compression: gzip      # gzip | none
    timeout: 10s
    batch_size: 256
    flush_interval: 2s
    max_retries: 3
    # Resource attributes. service.name falls back to OTEL_SERVICE_NAME, then
    # "keirouter"; extra attributes merge over OTEL_RESOURCE_ATTRIBUTES.
    service_name: ""
    resource_attributes: {} # e.g. { deployment.environment: prod }
    # Also export one record per gateway request (event keirouter.request,
    # scope .../requests): API key, provider, model, tokens, cost, latency,
    # status, fallbacks and guardrail outcome. Never prompt or response text.
    # Off by default because the volume follows your traffic.
    include_requests: false

mcp:
  # MCP gateway: clients call POST /mcp with a KeiRouter API key and reach
  # every MCP server registered on the dashboard.
  # Optional YAML file of company presets for the "add MCP server" picker.
  catalog_file: ""
  # true: servers can only be created from catalog presets.
  catalog_only: false
  # How often tool catalogs are refreshed from each server (0 disables).
  sync_interval: 5m
  # Tool-call log rows (mcp_call_logs) older than this are deleted.
  log_retention_days: 30
  # Per-key tool-call limits, counted apart from the key's LLM limits.
  default_rpm: 600
  default_concurrency: 20
  # Also write each tool call to the audit log as mcp.tool.call (key, server,
  # tool, outcome; never arguments or results). Needs audit.enabled.
  audit_tool_calls: true
  # Apply guardrail policies to tool arguments and results: PII masking or
  # blocking, and indirect prompt injection when the injection policy scans
  # tool results. Policies match provider "mcp" and model "slug__tool".
  guardrails: true

health:
  # Background account/model health checks. Unhealthy account/model pairs are
  # skipped by dispatch until probes recover.
  enabled: true
  interval: 30s
  timeout: 5s
  max_parallel: 8
  failure_threshold: 2
  success_threshold: 1
  recent_model_window: 24h
  max_models_per_provider: 8

# Actionable provider health dashboard: real-traffic telemetry aggregation +
# synthetic probes. All optional — sensible defaults apply when omitted.
provider_health:
  enabled: true
  probe_interval: 60s
  probe_timeout: 15s
  failure_threshold: 3
  queue_size: 5000
  current_flush_interval: 30s
  snapshot_interval: 60s
  rolling_window: 15m
  latency_thresholds:
    chat_completions: 10000
    embeddings: 5000
    image_generation: 60000
    audio: 60000
    search: 15000
  capabilities:
    chat_completions:
      enabled: true
      max_tokens: 5
      prompt: "Reply with OK only."
    embeddings:
      enabled: true
      input: "health check"
    image_generation:
      enabled: false
    audio:
      enabled: false
    search:
      enabled: false

cache:
  # Semantic response cache. Off by default. When enabled, repeated or
  # near-identical prompts are served from cache for zero upstream cost.
  enabled: false
  # "memory" (in-process, lost on restart) or "redis" (persistent, shared).
  backend: memory
  # Redis URL for backend=redis. Format: redis://host:port[/db]
  redis_url: ""
  # A candidate cache hit must score at least this cosine similarity [0,1].
  # Lower values allow more fuzzy matches (e.g. 0.85 catches paraphrases);
  # higher values restrict to near-exact prompts.
  similarity_threshold: 0.95
  # How long a cached entry stays valid.
  ttl: 1h

  # Embedding provider. "hash" (default) gives exact-match caching with zero
  # dependencies. "api" calls an OpenAI-compatible embeddings API for true
  # semantic near-match caching — prompts like "How do Go channels work?" and
  # "Explain Go channels" will match, saving 30-60% on repetitive workloads.
  embedding_provider: hash
  # Base URL for the embedding API (OpenAI, Voyage, local TEI, etc.).
  embedding_api_url: "https://api.openai.com/v1"
  # API key for the embedding provider. Can also be set via
  # KEIROUTER_CACHE__EMBEDDING_API_KEY env var.
  embedding_api_key: ""
  # Embedding model name.
  embedding_model: "text-embedding-3-small"
  # Output vector dimensions (must match the model's native dimension).
  embedding_dims: 1536

log:
  # debug | info | warn | error
  level: info
  # text | json
  format: text

data:
  # Root data directory. Empty => ~/.keirouter (or %APPDATA%/keirouter on Windows).
  dir: ""
