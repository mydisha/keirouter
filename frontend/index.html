<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tokenizer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved theme before first paint so dark mode never flashes
         white while the app bundle downloads. Mirrors ThemeProvider. -->
    <script>
      try {
        var t = localStorage.getItem("keirouter-theme");
        // Public pages default to dark unless light was chosen (PublicLayout).
        var pub = /^\/(bansos|model|ketentuan)?\/?$/.test(location.pathname);
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches) || (pub && t !== "light"))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
