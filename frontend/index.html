<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tokenizer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved theme before first paint so dark mode never flashes
         white while the app bundle downloads. Mirrors ThemeProvider. -->
    <script>
      try {
        var path = location.pathname;
        var dark = function (t) { return t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches); };
        // Public pages (PublicLayout) and the portal keep their own theme and
        // default to dark; the dashboard defaults to light.
        var on = /^\/(bansos|model|ketentuan(\/hosting-9router)?)?\/?$/.test(path)
          ? localStorage.getItem("keirouter-public-theme") !== "light"
          : /^\/portal(\/|$)/.test(path)
            ? (function (t) { return t ? dark(t) : true; })(localStorage.getItem("keirouter-portal-theme"))
            : dark(localStorage.getItem("keirouter-theme"));
        if (on) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
