# Weekly dependency updates.
#
# Each entry has two groups:
#   - "minor-patch": all minor and patch version updates in one PR.
#   - "security":    all security fixes in one PR.
# Major version bumps match neither group, so each still gets its own PR
# and can be reviewed on its own.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      root-npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      root-npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /deploy/promptguard
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      promptguard-pip-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      promptguard-pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /deploy
      - /deploy/promptguard
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
